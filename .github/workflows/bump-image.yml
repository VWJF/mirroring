name: Bump image

# Pins action.yml to a prebuilt GHCR image and commits that file.
# Does not create a git tag or GitHub Release — do those yourself after this is green.
run-name: Bump image ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Version to pin in action.yml (e.g. 0.0.3-alpha or 1.0.0). Leading v is
          stripped. Canonical image tag matches Publish image (no v-prefix).
          Any version: a '-' only matters later, when you mark the GitHub Release
          as a pre-release.
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Require a branch
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" != "branch" ]]; then
            echo "::error::Run Bump image from a branch (github.ref_name), not a tag."
            exit 1
          fi

      - name: Normalize version
        id: ver
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="${RAW#"${RAW%%[![:space:]]*}"}"
          raw="${raw%"${raw##*[![:space:]]}"}"
          raw="${raw#v}"
          if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$raw' (expected semver, e.g. 0.0.3-alpha)"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${raw}"
          {
            echo "version=$raw"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          echo "Canonical image tag: $image"

      - name: Detect current pin
        id: pin
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
        run: |
          set -euo pipefail
          if grep -E '^[[:space:]]+uses: docker://' action.yml | grep -Fq "docker://${IMAGE}"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "already bumped"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "action.yml is not pinned to docker://${IMAGE}"
          fi

      - uses: docker/login-action@v3
        if: steps.pin.outputs.already != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if GHCR image does not exist
        if: steps.pin.outputs.already != 'true'
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "$IMAGE"; then
            echo "::error::GHCR image ${IMAGE} does not exist yet. Run the Publish image workflow with this version first."
            exit 1
          fi

      - name: Pin Mirror ref step to GHCR image
        if: steps.pin.outputs.already != 'true'
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
        run: |
          set -euo pipefail
          uses="      uses: docker://${IMAGE}"
          existing="$(grep -E '^[[:space:]]+uses: docker://' action.yml | awk '{print $2}' | head -1 || true)"

          if [[ -n "$existing" ]]; then
            if [[ "$existing" != docker://${IMAGE%%:*}:* ]]; then
              echo "::error::action.yml is pinned to ${existing}, not this repo's GHCR image. Will not overwrite it. Pass the version that matches the pin you want."
              exit 1
            fi
            # Same image, different tag — replace only the uses line (version input is the new pin).
            sed -i -E "s|^[[:space:]]+uses: docker://.*|${uses}|" action.yml
          else
            # Convert run-mirror-docker.sh → docker://. Keep skip-actor, checkout,
            # and the commented runner-bash mirror.sh line.
            tmp="$(mktemp)"
            awk -v pin="$uses" '
              /- name: Mirror ref to GitLab/ { in_mirror=1 }
              in_mirror && /^      shell: bash$/ { next }
              in_mirror && /run-mirror-docker\.sh/ { next }
              in_mirror && /MIRROR_IMAGE_CONTEXT:/ { sub(/MIRROR_IMAGE_CONTEXT:.*/, "ACTION_PATH: /opt/mirroring") }
              in_mirror && /if: steps.skip_actor.outputs.skip != '\''true'\''/ { print; print pin; next }
              { print }
            ' action.yml > "$tmp"
            mv "$tmp" action.yml
          fi

          if ! grep -E '^[[:space:]]+uses: docker://' action.yml | grep -Fq "docker://${IMAGE}"; then
            echo "::error::Failed to pin action.yml to docker://${IMAGE}"
            exit 1
          fi

      - name: Commit and push action.yml
        if: steps.pin.outputs.already != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add action.yml
          if git diff --cached --quiet; then
            echo "::error::Pin step reported a change but action.yml has no diff"
            exit 1
          fi
          git commit -m "chore: pin mirror image to ${VERSION}"

          if ! git push origin "HEAD:${BRANCH}"; then
            echo "::error::Failed to push to ${BRANCH}. Branch protection may block GITHUB_TOKEN. Allow GitHub Actions to push, or use a PAT with contents:write. Do not force-push or move tags."
            exit 1
          fi
