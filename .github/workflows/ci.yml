name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Shellcheck
        run: |
          files=(src/*.sh entrypoint.sh .github/scripts/*.sh)
          echo "Checking: ${files[*]}"
          shellcheck -x -P .github/scripts -f gcc "${files[@]}"
          echo "shellcheck passed (${#files[@]} files)"
          {
            echo "### Shellcheck"
            echo "Passed: \`${files[*]}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Forbid test image pins on default-branch PRs
        if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        run: bash .github/scripts/check-action-pin.sh --forbid-test-tags

      # Feature branches skip this. After merge, the pin's image/v* sources
      # must match main. Legacy pins without an image/v* git tag are skipped.
      - name: Image pin matches main
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(bash .github/scripts/action-image-pin.sh get)"
          bash .github/scripts/check-action-pin.sh --forbid-test-tags
          if git rev-parse -q --verify "refs/tags/image/v${tag}" ||
            git fetch origin "refs/tags/image/v${tag}:refs/tags/image/v${tag}"; then
            bash .github/scripts/image-contents-match.sh "image/v${tag}" HEAD
          else
            echo "No git tag image/v${tag}; skip contents match"
          fi

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          verbose: true

      - name: Hadolint summary
        run: |
          echo "hadolint passed on Dockerfile"
          {
            echo "### Hadolint"
            echo "Passed: \`Dockerfile\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docker build
        run: docker build -t mirroring:ci .
