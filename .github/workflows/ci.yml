name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Docker copies match scripts/
        run: |
          diff -q scripts/mirror.sh mirror/scripts/mirror.sh
          diff -q scripts/askpass.sh mirror/scripts/askpass.sh

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Shellcheck
        run: |
          files=(scripts/*.sh mirror/entrypoint.sh)
          echo "Checking: ${files[*]}"
          shellcheck -f gcc "${files[@]}"
          echo "shellcheck passed (${#files[@]} files)"
          {
            echo "### Shellcheck"
            echo "Passed: \`${files[*]}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: mirror/Dockerfile
          verbose: true

      - name: Hadolint summary
        run: |
          echo "hadolint passed on mirror/Dockerfile"
          {
            echo "### Hadolint"
            echo "Passed: \`mirror/Dockerfile\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docker build
        run: docker build -f mirror/Dockerfile -t mirroring:ci ./mirror
